# Spark 开发流的代码执行沙箱策略（OpenShell）。基于镜像自带的 /etc/openshell/policy.yaml 收紧：
#   · 文件系统：系统目录只读，只有 /sandbox 和 /tmp 可写（工作区副本放在 /sandbox/work/）；
#   · 进程：以非 root 的 sandbox 用户运行；
#   · 网络：一条放行规则都没有 —— agent 写的代码出不了网（npm install / pip install / curl 都会被 403）。
# 要放行某个域名，在 network_policies 里加一条，格式见镜像里的 /etc/openshell/policy.yaml。
version: 1

filesystem_policy:
  include_workdir: true
  read_only:
    - /usr
    - /lib
    - /proc
    - /dev/urandom
    - /app
    - /etc
    - /var/log
  read_write:
    - /sandbox
    - /tmp
    - /dev/null

landlock:
  compatibility: best_effort

process:
  run_as_user: sandbox
  run_as_group: sandbox

network_policies: {}
