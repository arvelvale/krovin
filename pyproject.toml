[project]
name = "krovin"
version = "0.1.0"
description = "KROVIN：跑在 NVIDIA DGX Spark 上的开发流 agent，结合 JEV 结构化决策与本地、云端模型路由"
requires-python = ">=3.11"
dependencies = ["pyyaml>=6"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --basetemp=var/pytest-tmp"
